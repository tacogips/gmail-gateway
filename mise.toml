min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
swift = "6.3.3"
swiftlint = "latest"
gitleaks = "latest"
github-cli = "latest"
gcloud = "latest"
pre-commit = "latest"

[tasks."default"]
description = "Show available tasks"
run = '''
mise tasks ls
'''

[tasks."build"]
description = "Build the Swift package"
run = '''
swift build
'''

[tasks."run"]
description = "Run the executable"
run = '''
swift run mail-gateway-reader "$@"
'''

[tasks."run:reader"]
description = "Run the read-only mail gateway"
run = 'swift run mail-gateway-reader "$@"'

[tasks."run:draft"]
description = "Run the draft-capable mail gateway"
run = 'swift run mail-gateway-draft "$@"'

[tasks."run:sender"]
description = "Run the send-capable mail gateway"
run = 'swift run mail-gateway-sender "$@"'

[tasks."test"]
description = "Run Swift tests and smoke tests"
run = '''
swift test
swift build --target MailGatewaySwiftSmokeTests
.build/debug/mail-gateway-swift-smoke-tests
'''

[tasks."clean"]
description = "Clean SwiftPM and release artifacts"
run = '''
rm -rf .build dist release
'''

[tasks."lint"]
description = "Run SwiftLint when available"
run = '''
swiftlint
'''

[tasks."build:homebrew"]
description = "Build standalone Homebrew formula archives for the current platform, or pass targets after --"
run = '''
scripts/build-homebrew-release.sh "$@"
'''

[tasks."homebrew:formula"]
description = "Render split Formula/*.rb files from dist/homebrew checksums"
run = '''
scripts/render-homebrew-formula.sh "$@"
'''

[tasks."homebrew:tap-formula"]
description = "Render split formulae into the default sibling Homebrew tap checkout"
run = '''
set -euo pipefail
if [ -z "$*" ]; then
  echo "usage: mise run homebrew:tap-formula -- <version>" >&2
  exit 2
fi
scripts/render-homebrew-formula.sh "$*" "../homebrew-tap/Formula"

'''

[tasks.install-git-hooks]
description = "Install mise tools and the repository pre-commit hook"
run = '''
mise install

hooks_path=$(git config --local --get core.hooksPath || true)
if [ "$hooks_path" = ".git/hooks" ]; then
  git config --local --unset-all core.hooksPath
  hooks_path=""
fi

if [ -z "$hooks_path" ]; then
  mise exec -- pre-commit install
else
  mise exec -- pre-commit validate-config .pre-commit-config.yaml
  echo "Using existing custom Git hooks path: $hooks_path"
fi
'''
